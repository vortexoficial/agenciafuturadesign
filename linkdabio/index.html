<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xibiu Demais - Achadinhos e Indicações</title>

  <!-- SEO -->
  <meta name="description" content="Achadinhos, promoções e produtos que facilitam a vida. Xibiu Demais traz os melhores links de afiliados para você!" />
  <meta name="keywords" content="achadinhos, afiliados, promoções, produtos, xibiu demais, indicações" />
  <meta name="author" content="Xibiu Demais" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Xibiu Demais - Achadinhos e Indicações" />
  <meta property="og:description" content="Achadinhos, promoções e produtos que facilitam a vida. Clica antes que acabe!" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="og-image.jpg" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Xibiu Demais" />
  <meta name="twitter:description" content="Achadinhos, promoções e produtos que facilitam a vida." />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>X</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="container">

    <!-- ===== PRODUCTS SECTION ===== -->
    <main class="products-section">

      <h2 class="section-title">
        <img
          src="https://media.lordicon.com/icons/wired/flat/237-star-rating.svg"
          alt=""
          class="licon licon-title"
        />
        Links dos produtos indicados
      </h2>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <span class="search-icon">
          <img
            src="https://media.lordicon.com/icons/wired/flat/19-magnifier-zoom-search.svg"
            alt="Pesquisar"
            class="licon"
          />
        </span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Pesquisar produto..."
          aria-label="Pesquisar produtos"
          autocomplete="off"
        />
      </div>

      <!-- No Results Message -->
      <div id="noResults" class="no-results hidden" aria-live="polite">
        <img
          src="https://media.lordicon.com/icons/wired/flat/263-emoji-sad.svg"
          alt=""
          class="licon licon-xl"
        />
        <p>Nenhum produto encontrado. Tenta outra busca!</p>
      </div>

      <!-- Products Grid (dynamically generated by script.js) -->
      <div id="productsGrid" class="products-grid" aria-label="Lista de produtos"></div>

    </main>

    <!-- ===== CONTACT SECTION ===== -->
    <section class="contact-section">
      <p class="contact-title">Ficou com dúvida ou quer mais indicações?</p>
      <div class="contact-buttons">

        <a href="https://wa.me/5575819736280?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20para%20comprar%20um%20produto%20xibiu!" target="_blank" rel="noopener noreferrer" class="contact-btn whatsapp">
          <img src="https://media.lordicon.com/icons/wired/flat/2543-logo-whatsapp.svg" alt="" class="licon licon-btn licon-white" />
          Falar no WhatsApp
        </a>

        <a href="https://instagram.com/xibiudemais" target="_blank" rel="noopener noreferrer" class="contact-btn instagram">
          <img src="https://media.lordicon.com/icons/wired/flat/2542-logo-instagram.svg" alt="" class="licon licon-btn licon-white" />
          Ver no Instagram
        </a>

      </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <p class="footer-main">Indicações selecionadas com carinho por Xibiu Demais</p>
      <p class="footer-disclaimer">
        <img
          src="https://media.lordicon.com/icons/wired/flat/1657-alert.svg"
          alt=""
          class="licon licon-sm licon-faint"
        />
        Alguns links podem gerar comissão sem custo extra para você.
      </p>
    </footer>

    <!-- ===== CREDITS ===== -->
    <div class="credits">
      <span class="credits-label">Desenvolvido pela</span>
      <a href="https://agenciafuturadesign.com" target="_blank" rel="noopener noreferrer" class="credits-link">
        <img
          src="https://raw.githubusercontent.com/vortexoficial/agenciafuturadesign/main/img/logop.webp"
          alt="Futura Design"
          class="credits-logo"
        />
      </a>
    </div>

  </div><!-- /container -->

  <script src="script.js"></script>
</body>
</html>
